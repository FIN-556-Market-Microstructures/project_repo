[project]
name = "fin556-ofi"
version = "0.1.0"
description = "Order flow imbalance and short-term price prediction (FIN 556)"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
